[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openwheel_design"
version = "1.0.0"
description = "Formula Student araç tasarım ve analiz kütüphanesi"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Openwheel Design Team", email = "contact@openwheel.design"}
]
keywords = ["formula student", "fsae", "racing", "vehicle dynamics", "engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mechanical Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]
sim = ["numpy>=1.24", "scipy>=1.10"]
gui = ["PySide6>=6.6", "matplotlib>=3.7"]
plot = ["matplotlib>=3.7", "pandas>=2.0"]

[project.scripts]
openwheel = "openwheel_design.cli:main"
openwheel-gui = "openwheel_design.gui.main_window:run_gui"

[project.urls]
Homepage = "https://github.com/ye5il/openwheel_design"
Documentation = "https://openwheel.design/docs"
Repository = "https://github.com/ye5il/openwheel_design"
Issues = "https://github.com/ye5il/openwheel_design/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openwheel_design = ["py.typed", "gui/theme.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.ruff]
line-length = 88
target-version = "py38"